 s.logs=Array.isArray(raw.logs)?raw.logs.slice(0,150).filter(x=>x&&typeof x.text==='string').map(x=>({text:text(x.text,500),at:text(x.at,50)})):[];

function nav(){document.getElementById('nav').innerHTML=views.map(([key,title])=>`<button data-view="${key}" class="${view===key?'active':''}" ${view===key?'aria-current="page"':''}>${icon(key)}<span class="nav-label">${title}</span><span class="nav-short">${({overview:"总览",schools:"九校",courses:"课程",common:"共用",budget:"预算",timeline:"时间",sources:"资料"})[key]}</span>${key==='schools'?'<span class="count">9</span>':''}</button>`).join('');document.getElementById('crumb').textContent=views.find(x=>x[0]===view)[1]}
function header(title,sub,extra=''){return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div>${extra||`<span class="date">${day().replaceAll('-',' / ')} · 武汉时间</span>`}</div>`}
function badge(text,tone=''){return `<span class="badge ${tone}">${esc(text)}</span>`}
function progress(label,n,color=''){const known=Number.isFinite(n);return `<div class="bar-row"><span>${label}</span><div class="bar ${color}"><i style="width:${known?Math.max(0,Math.min(100,n??0)):0}%"></i></div><b>${known?n+'%':'待核对'}</b></div>`}
function courseMatch(sc){const groups=sc.topics.map(t=>{const courses=state.courses.filter(c=>t.ids.includes(c.id));return {...t,courses,planned:courses.some(c=>c.required||c.selected||c.status==='已完成'),done:courses.some(c=>c.status==='已完成')}});return {groups,valid:sc.matchValid!==false,planned:sc.matchValid===false?null:pct(groups.filter(g=>g.planned).length,groups.length),done:sc.matchValid===false?null:pct(groups.filter(g=>g.done).length,groups.length)}}
function appProgress(sc){return pct(sc.process.filter(t=>t.done).length,sc.process.length)}
function budgetCalc(tuition=state.budget.tuition){const b=state.budget;const eur=num(b.monthly)*12+num(tuition)*2+num(b.semester)*2+num(b.oneoff)+num(b.buffer);return {eur,cny:eur*num(b.rate),gap:state.profile.budget-eur*num(b.rate)}}
function allTasks(){return [...state.common,...state.schools.flatMap(s=>s.process.map(t=>({...t,school:s.id,schoolName:s.short})))]}

 if(!confirmed)out.push({title:'先确认已经修完的课程',body:'培养方案已录入，但没有把必修课自动视为已完成。确认成绩单后，九校的已修覆盖率才会变化。',target:'courses',tone:'warn'});
 if(!num(state.exams.ielts))out.push({title:'英语成绩是九校共用的准备项',body:'先完成雅思模考和首考计划。个人目标 7.0，各项目是否达标仍按官网要求核对。',target:'common'});
 const berlin=state.schools.find(s=>s.id==='berlin');if(berlin&&berlin.program.includes('Computer Science'))out.push({title:'柏林：先核对理论计算机 12 CP',body:'英授方向已替换。培养方案未见明确理论计算机课，选修编程课不能自动补上这项。',target:'schools',school:'berlin',tone:'warn'});
 const upcoming=state.schools.filter(s=>s.deadline&&daysTo(s.deadline)<=56&&s.status!=='已递交'&&s.status!=='已录取'&&s.status!=='已拒绝');upcoming.forEach(s=>out.unshift({title:s.short+'：'+(daysTo(s.deadline)<0?'已过记录的截止日':'距离截止 '+daysTo(s.deadline)+' 天'),body:(s.deadlineVerified?'已确认日期。':'这是个人计划日期，尚未核实为官方截止日。')+'检查完整递交、VPD 和补件安排。',target:'schools',school:s.id,tone:'bad'}));
 const late=allTasks().filter(t=>!t.done&&t.due&&daysTo(t.due)<0);if(late.length)out.unshift({title:late.length+' 项待办已到期',body:'进入时间线查看；内部计划日期可按实际情况调整。',target:'timeline',tone:'bad'});

 if(state.exams.apsStatus!=='已获证')out.push({title:'APS 一份准备，多校使用',body:'核对在读生适用程序与当期安排。各大学是否要求申请时提交 APS，仍要逐校确认。',target:'common'});
 const miss=state.schools.filter(s=>!s.ruleVerified).length;if(miss)out.push({title:miss+' 校仍待完成正式资格核对',body:'方向覆盖只按课程主题计算。尚未核实全部学分门槛、语言及在读申请规则，不能据此判断录取。',target:'schools',tone:'warn'});
 if(!out.length)out.push({title:'当前记录没有触发新的提醒',body:'继续检查官网更新和下一项申请步骤；记录完整并不表示已经获录取。',target:'schools'});return out;

function schoolPage(){const s=state.schools.find(x=>x.id===schoolId)||state.schools[0],m=courseMatch(s);return header('九校申请','独立流程 · 共用成绩')+`<div class="school-switch" aria-label="选择学校">${state.schools.map(x=>`<button class="${x.id===s.id?'active':''}" data-school-select="${x.id}">${esc(x.short)}</button>`).join('')}</div><section class="panel"><div class="school-detail-header"><div><h2>${esc(s.name)}</h2><p>${esc(s.program)}</p></div><div class="status-row">${badge(s.ruleVerified?'已复核':'待复核',s.ruleVerified?'good':'warn')}<button class="small" data-action="edit-school" data-id="${s.id}">编辑项目与规则</button></div></div><div class="three-metrics"><div class="metric"><b>${m.valid?m.planned+'%':'待重建'}</b><span>计划课程主题覆盖</span></div><div class="metric"><b>${m.valid?m.done+'%':'待重建'}</b><span>已修课程主题覆盖</span></div><div class="metric"><b>${appProgress(s)}%</b><span>本校申请清单完成</span></div></div><div class="facts"><span>授课语言<b>${esc(s.language)}</b></span><span>申请路径<b>${esc(s.route)}</b></span><span>状态<b>${esc(s.status)}</b></span><span>截止日期<b>${s.deadline?esc(s.deadline)+(s.deadlineVerified?'（已确认）':'（个人计划）'):'2028 当期待核实'}</b></span></div><div class="link-row"><a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">项目官网</a>${s.sources.map(x=>`<a href="${esc(safeURL(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>`).join('')}<span class="source-date">资料核查 ${esc(s.checked||'待核查')}</span></div><details class="brief-help"><summary>申请要点与风险</summary><p>${esc(s.ruleNote)}</p></details><div class="facts"><span>英语<b>${esc(s.ielts)}</b></span><span>GRE<b>${esc(s.gre)}</b></span><span>在读申请<b>${esc(s.graduateRule)}</b></span></div></section><div class="grid-2"><section class="panel"><div class="section-title" style="margin-top:0"><h2>本校独立申请流程</h2><button class="small" data-action="add-task" data-scope="${s.id}">＋ 添加步骤</button></div>${s.process.map(t=>taskRow(t,s.id)).join('')}<div class="subsection"><label class="field">本校笔记<textarea data-school-notes="${s.id}" placeholder="记录选方向、材料版本、邮件答复与申请编号。">${esc(s.notes)}</textarea></label></div></section><section class="panel"><h3>引用同一份共用准备</h3><div class="facts"><span>雅思<b>${esc(state.exams.ieltsStatus)}${num(state.exams.ielts)?' · '+num(state.exams.ielts):''}</b></span></div><div class="facts"><span>GRE<b>${esc(state.exams.greStatus)}</b></span></div><div class="facts"><span>APS<b>${esc(state.exams.apsStatus)}</b></span></div><p class="small-text muted">共用记录一次更新；门槛逐校核对。</p><button class="small" data-view="common">更新共用准备</button><div class="section-title"><h3>学费情景</h3></div><p class="small-text">录入的每学期学费 ${euro(s.tuition)}<br>按当前年度方案估算 <b>${money(budgetCalc(s.tuition).cny)}</b></p>${badge(budgetCalc(s.tuition).gap<0?'超出年度预算':'在当前年度预算内',budgetCalc(s.tuition).gap<0?'bad':'good')}<p class="tiny muted">${esc(s.feeNote)}</p><button class="small" data-view="budget">查看预算假设</button></section></div><section class="panel"><h2>本校课程主题对照</h2><p class="small-text muted">按主题初筛，不等于正式学分认定。</p><details class="brief-help"><summary>匹配依据</summary><p>${esc(s.matchBasis)} 每个主题有候选课即计覆盖。</p></details><button class="small" data-action="edit-mapping" data-id="${s.id}" style="margin-bottom:14px">修改主题与数量条件</button>${topicTable(s,m)}${m.valid?formalTable(s):''}<button class="small" data-view="courses" style="margin-top:16px">维护本科课程记录</button></section>`}
function topicTable(s,m){if(!m.valid)return '<div class="notice warn">项目已更换，覆盖率暂停计算。请点击“修改主题与数量条件”建立新项目对应关系。</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr><th>核对主题</th><th>培养方案中的候选课程</th><th>计划覆盖</th><th>已修覆盖</th></tr></thead><tbody>${m.groups.map(g=>`<tr><td>${esc(g.name)}</td><td class="desc">${g.courses.map(c=>`<span class="topic-course">${esc(c.name)} ${c.credits} 学分${!c.required?'（选修）':''}</span>`).join('<br>')||'<span class="muted">未找到明确对应，需查大纲或补修。</span>'}</td><td>${badge(g.planned?'有候选课程':'待补充',g.planned?'blue':'warn')}</td><td>${badge(g.done?'有已修记录':'待确认',g.done?'good':'')}</td></tr>`).join('')}</tbody></table></div>`}
function formalTable(s){if(!s.formal.length)return `<div class="notice" style="margin-top:20px">正式学分匹配：待核对本项目当期录取规定、详细课程大纲和你的实际成绩单。当前主题覆盖率不会自动换算成官方学分匹配率。</div>`;return `<h3 style="margin-top:24px">官网明确的数量条件</h3><p class="small-text muted">只填按学校规则核对后的对应 CP/ECTS，不将中国学分直接等同，也不采用通用换算系数。</p><div class="table-wrap"><table class="data-table"><thead><tr><th>要求模块</th><th>官网最低值</th><th>已核对对应值</th><th>数量核对</th></tr></thead><tbody>${s.formal.map((f,i)=>{const actual=s.recognized[f.id],known=actual!==''&&actual!==undefined;return `<tr><td>${esc(f.name)}</td><td>${f.min} ${esc(f.unit)}</td><td><input type="number" min="0" max="500" step="0.5" value="${known?num(actual):''}" data-recognized="${s.id}" data-module="${f.id}" aria-label="${esc(f.name)}已核对对应学分" placeholder="待核对"></td><td>${badge(!known?'待核对':num(actual)>=f.min?'数量达到':'数量不足',!known?'':num(actual)>=f.min?'good':'bad')}</td></tr>`}).join('')}</tbody></table></div>`}
function coursesPage(){const courses=state.courses.filter(c=>(courseFilter==='all'||(courseFilter==='required'&&c.required)||(courseFilter==='elective'&&!c.required)||(courseFilter==='done'&&c.status==='已完成'))&&(!query||(c.name+' '+c.id+' '+c.category).toLowerCase().includes(query.toLowerCase())));const selected=state.courses.filter(c=>c.required||c.selected),completed=state.courses.filter(c=>c.status==='已完成');return header('课程与选修','勾选计划与已修，查看对应学校。')+`<div class="summary-strip"><div><b>${state.courses.length}</b><span>去重后的专业相关课程</span></div><div><b>${selected.reduce((n,c)=>n+c.credits,0).toFixed(1)}</b><span>已列入计划的中国学分</span></div><div><b>${completed.length}</b><span>已由你确认修完的课程</span></div><div><b>${completed.reduce((n,c)=>n+c.credits,0).toFixed(1)}</b><span>已确认完成的中国学分</span></div></div><div class="notice">选修至少 11 学分：公共 ≥3；一个方向 ≥8（含对应 4 学分课程设计）。必修默认列入计划，已修需自己确认。</div>${electivesGuide()}<section class="panel"><div class="toolbar"><div class="filters">${[['all','全部'],['required','必修'],['elective','选修'],['done','已完成']].map(([v,t])=>`<button class="filter ${courseFilter===v?'active':''}" data-course-filter="${v}">${t}</button>`).join('')}</div><input id="course-search" type="search" value="${esc(query)}" placeholder="搜索课程、代码或类别" aria-label="搜索课程"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>计划修读</th><th>课程 / 代码</th><th>类别</th><th>学分</th><th>学时</th><th>学期</th><th>实际修读</th><th>成绩</th><th>学校与要求对照</th></tr></thead><tbody id="course-rows">${courses.map(courseRow).join('')||'<tr><td colspan="9" class="empty">没有符合条件的课程，试试其他关键词。</td></tr>'}</tbody></table></div><p class="tiny muted">来源为培养方案 PDF 第 6—10 页（原书第 403—407 页）；按课程代码去重。学时保留“周”单位；不将实验表与课程表重复累加。未录入通识、外语、体育等课程。</p></section><section class="panel"><h2>九校主题覆盖同步结果</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>学校 / 项目</th><th>计划主题覆盖</th><th>已修主题覆盖</th><th>正式条件</th></tr></thead><tbody>${state.schools.map(s=>{const m=courseMatch(s);return `<tr><td><button class="quiet small" data-view="schools" data-school="${s.id}">${esc(s.short)}</button><br><span class="tiny muted">${esc(s.program)}</span></td><td>${m.valid?m.planned+'%':'待重建'} · ${m.groups.filter(g=>g.planned).length}/${m.groups.length} 主题</td><td>${m.valid?m.done+'%':'待重建'} · ${m.groups.filter(g=>g.done).length}/${m.groups.length} 主题</td><td>${badge(s.ruleVerified?'已由我复核':'待完整核验',s.ruleVerified?'good':'warn')}</td></tr>`}).join('')}</tbody></table></div></section>`}
function electiveLinks(c){return state.schools.flatMap(s=>s.matchValid===false?[]:s.topics.filter(t=>t.ids.includes(c.id)).map(t=>({school:s,topic:t,kind:t.kind||'方向参考',gap:!state.courses.some(other=>other.id!==c.id&&(other.required||other.selected||other.status==='已完成')&&t.ids.includes(other.id))})))}
function electiveCell(c){if(c.required)return '<span class="muted">必修基础</span>';const links=electiveLinks(c);if(!links.length)return '<span class="muted">暂未找到明确对应</span>';const schools=[...new Set(links.map(l=>l.school.id))];return `<details class="elective-detail"><summary>${schools.length} 校相关 · ${links.filter(l=>l.gap).length?'可补主题缺口':'可加深基础'}</summary>${links.map(l=>`<div class="elective-link"><button class="small quiet" data-view="schools" data-school="${l.school.id}">${esc(l.school.short)}</button>${badge(l.kind,['官网先修','选拔评分项'].includes(l.kind)?'blue':'')}<div>${esc(l.topic.name)}${l.gap?' · 当前缺口':''}</div></div>`).join('')}</details>`}
function electivesGuide(){const elective=state.courses.filter(c=>!c.required),rows=elective.map(c=>{const links=electiveLinks(c),hard=links.filter(l=>['官网先修','选拔评分项'].includes(l.kind)),gap=links.filter(l=>l.gap);return {c,links,hard,gap,score:gap.filter(l=>l.kind==='官网先修').length*100+hard.length*5+gap.length*2+new Set(links.map(l=>l.school.id)).size}}).sort((a,b)=>b.score-a.score||a.c.id.localeCompare(b.c.id));return `<section class="panel elective-guide"><div class="section-title" style="margin-top:0"><h2>选修怎么选</h2><button class="small" data-course-filter="elective">查看全部 ${elective.length} 门</button></div><p class="small-text muted">先补缺口，再选方向。标签指对应的要求模块，并非学校指定必修这门课；最终按课程大纲认定。</p><div class="elective-picks">${['EIC5271','EIC5581','EIC5302'].map(cid=>rows.find(x=>x.c.id===cid)).filter(x=>x&&x.links.length).map(x=>`<div><h3>${esc(x.c.name)}</h3><p>${x.gap.some(l=>l.kind==='官网先修')?'可补官网先修主题：'+x.gap.filter(l=>l.kind==='官网先修').map(l=>l.school.short).join('、'):x.hard.length?'可对应先修/评分模块；仍需校方认定':'用于相关方向准备'}</p><span class="tiny muted">${new Set(x.links.map(l=>l.school.id)).size} 校相关 · ${x.c.credits} 学分</span></div>`).join('')}</div><details class="brief-help"><summary>选课边界</summary><p>德累斯顿的 Java 对应明确的面向对象编程先修。柏林理论计算机仍是缺口，Python、Java、机器学习不能仅凭名称替代。课程设计适合展示项目能力，不自动替代理论先修。计划覆盖按主题计算，同一课程的 CP 不可重复分配。</p></details></section>`}
function courseRow(c){return `<tr><td><input type="checkbox" ${c.required||c.selected?'checked':''} ${c.required?'disabled':''} data-course-plan="${c.id}" aria-label="计划修读${esc(c.name)}">${c.required?'<span class="tiny muted"> 必修</span>':''}</td><td class="course-name">${esc(c.name)}<br><span class="tiny muted">${c.id} · PDF 第 ${c.page} 页</span></td><td>${esc(c.category)}</td><td>${c.credits}</td><td>${esc(c.hours)}</td><td>${c.semester}</td><td><select data-course-status="${c.id}" aria-label="${esc(c.name)}实际修读状态">${options(['未确认','在修','已完成'],c.status)}</select></td><td><input type="number" min="0" max="100" step="0.1" value="${esc(c.grade)}" placeholder="—" data-course-grade="${c.id}" aria-label="${esc(c.name)}成绩"></td><td class="elective-match">${electiveCell(c)}</td></tr>`}
function options(arr,current){return arr.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('')}
function field(label,name,value,type='text',extra=''){return `<label class="field">${label}<input type="${type}" name="${name}" value="${esc(value)}" ${extra}></label>`}
function selectField(label,name,value,arr){return `<label class="field">${label}<select name="${name}">${options(arr,value)}</select></label>`}
function commonPage(){const e=state.exams,list=state.common.filter(t=>taskFilter==='all'||(taskFilter==='todo'&&!t.done)||(taskFilter==='done'&&t.done));return header('共用准备','雅思 · GRE · APS · 基础材料')+`<form id="exam-form"><div class="grid-equal"><section class="panel"><h2>雅思 Academic</h2><div class="form-grid">${selectField('当前阶段','ieltsStatus',e.ieltsStatus,['未开始','准备中','已报名','已考试待出分','已有成绩'])}${field('考试日期','ieltsDate',e.ieltsDate,'date')}${field('总分','ielts',e.ielts,'number','min="0" max="9" step="0.5"')}${field('个人目标总分','ieltsTarget',e.ieltsTarget,'number','min="0" max="9" step="0.5"')}</div><div class="score-grid" style="margin-top:15px">${[['听力','listening'],['阅读','reading'],['写作','writing'],['口语','speaking']].map(([l,k])=>field(l,k,e[k],'number','min="0" max="9" step="0.5"')).join('')}</div><p class="tiny muted">目标分不是各校统一要求；六级成绩不自动替代雅思。成绩日期用于你自行检查学校认可的有效期。</p></section><section class="panel"><h2>GRE General</h2><div class="form-grid">${selectField('当前阶段','greStatus',e.greStatus,['未开始','准备中','已报名','已考试待出分','已有成绩','待确定是否需要'])}${field('考试日期','greDate',e.greDate,'date')}${field('Verbal','greV',e.greV,'number','min="130" max="170" step="1"')}${field('Quantitative','greQ',e.greQ,'number','min="130" max="170" step="1"')}${field('Analytical Writing','greAW',e.greAW,'number','min="0" max="6" step="0.5"')}</div><p class="tiny muted">不使用统一“总分线”判定九校达标；百分位和送分要求也可能影响资格。</p></section></div><section class="panel"><h2>APS 与共用材料</h2><div class="form-grid">${selectField('APS 状态','apsStatus',e.apsStatus,['未开始','准备材料','已递交','等待审核/考试','已获证','待补件/重新审核'])}${selectField('拟采用程序','apsMethod',e.apsMethod,['待核对','TestAS 路径（须符合当期规定）','面谈路径','其他适用程序'])}${field('个人计划日期','apsDate',e.apsDate,'date')}<label class="field">共用准备备注<textarea name="notes">${esc(e.notes)}</textarea></label></div><div class="form-actions"><button class="primary" type="submit">保存考试与 APS 记录</button></div></section></form><section class="panel"><div class="section-title" style="margin-top:0"><h2>共用待办清单</h2><div class="filters">${[['all','全部'],['todo','未完成'],['done','已完成']].map(([v,t])=>`<button class="filter ${taskFilter===v?'active':''}" data-task-filter="${v}">${t}</button>`).join('')}</div></div>${list.map(t=>taskRow(t,'common')).join('')||'<div class="empty">当前筛选下没有待办。</div>'}</section>`}
function budgetPage(){const b=state.budget,c=budgetCalc();return header('预算测算','按个人汇率和生活费估算。')+`<div class="grid-equal"><section class="panel"><h2>年度预算假设</h2><form id="budget-form"><div class="form-grid">${field('年度预算 / 人民币','annual',state.profile.budget,'number','min="0" max="10000000" step="1000"')}${field('规划汇率 / 人民币每欧元','rate',b.rate,'number','min="0.1" max="50" step="0.1"')}${field('每月生活费 / 欧元','monthly',b.monthly,'number','min="0" max="30000" step="50"')}${field('每学期学费 / 欧元','tuition',b.tuition,'number','min="0" max="100000" step="100"')}${field('每学期杂费 / 欧元','semester',b.semester,'number','min="0" max="10000" step="10"')}${field('机票、材料与安置 / 欧元每年','oneoff',b.oneoff,'number','min="0" max="100000" step="100"')}${field('年度应急预留 / 欧元','buffer',b.buffer,'number','min="0" max="100000" step="100"')}${field('住房押金等周转资金 / 欧元','deposit',b.deposit,'number','min="0" max="100000" step="100"')}</div><p class="tiny muted">生活费已含房租、伙食、保险和日常交通。押金是额外现金周转，未计入年度永久支出。冻结账户中的生活资金不重复计为学费。</p><div class="form-actions"><button class="primary" type="submit">更新预算测算</button></div></form></section><section class="panel"><h2>当前年度情景</h2><div class="budget-total"><strong>${money(c.cny)}</strong><p>${euro(c.eur)} / 年，${c.gap>=0?'预算余量 '+money(c.gap):'超出预算 '+money(-c.gap)}</p></div><div class="budget-lines"><div><span>生活费 × 12 个月</span><b>${euro(b.monthly*12)}</b></div><div><span>学费 × 2 学期</span><b>${euro(b.tuition*2)}</b></div><div><span>学期杂费 × 2</span><b>${euro(b.semester*2)}</b></div><div><span>机票 / 材料 / 安置</span><b>${euro(b.oneoff)}</b></div><div><span>年度应急预留</span><b>${euro(b.buffer)}</b></div><div><span>额外现金周转</span><b>${money(b.deposit*b.rate)}</b></div></div><div class="notice ${c.gap<0?'bad':'good'}">按两年同等年度支出估算 ${money(c.cny*2)}，另备押金等周转资金 ${money(b.deposit*b.rate)}。未计延期、涨价或汇率变化。</div><p class="small-text muted">奖学金与打工收入没有预先抵扣。签证资金证明金额应在实际办理时按官方要求核对。</p></section></div><section class="panel"><h2>九校学费情景对比</h2><p class="small-text muted">下表只替换各校已录入的学费，统一沿用上方生活费假设，不代表各城市真实费用。学费为规划参考，2028 年当期与具体项目还需复核。</p><div class="table-wrap"><table class="data-table"><thead><tr><th>学校</th><th>每学期学费情景</th><th>年度总额</th><th>年度余量</th><th>费用说明</th></tr></thead><tbody>${state.schools.map(s=>{const x=budgetCalc(s.tuition);return `<tr><td>${esc(s.short)}</td><td>${euro(s.tuition)}</td><td>${money(x.cny)}</td><td>${badge((x.gap>=0?'+':'−')+money(Math.abs(x.gap)),x.gap>=0?'good':'bad')}</td><td class="desc">${esc(s.feeNote)}</td></tr>`}).join('')}</tbody></table></div></section>`}
function timelinePage(){const dated=allTasks().filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due));return header('时间线与行动记录','个人计划与学校截止日分别记录。')+`<div class="grid-equal"><section class="panel"><h2>到 2028 年的准备节奏</h2>${SEED.milestones.map(m=>`<div class="time-item"><time>${esc(m.when)}</time><div><h3>${esc(m.title)}</h3><p>${esc(m.text)}</p></div></div>`).join('')}<div class="notice" style="margin-top:20px">以上是工作安排，不是大学公布的截止日。项目可能在毕业前关闭申请，需逐校确认在读申请和补交学位证规则。</div></section><section class="panel"><h2>我的有日期待办</h2>${dated.map(t=>taskRow(t,t.school||'common',false)).join('')||'<div class="empty">还没有设置个人计划日期。<br>添加待办时填写日期，或在九校档案设置申请截止日。</div>'}<h3 style="margin-top:26px">九校截止日</h3>${state.schools.map(s=>`<div class="log-item"><span>${esc(s.short)}</span><span>${s.deadline?esc(s.deadline)+(s.deadlineVerified?' 已确认':' 个人计划'):'2028 当期待核实'}</span></div>`).join('')}</section></div><section class="panel"><h2>最近的进展</h2>${state.logs.slice(0,30).map(l=>`<div class="log-item"><span>${esc(l.text)}</span><time>${esc(l.at)}</time></div>`).join('')||'<p class="muted">完成一项任务或更新记录后，进展会显示在这里。</p>'}</section>`}
function sourcesPage(){return header('资料与备份','记录存于当前浏览器；换设备前先备份。')+`<section class="panel"><h2>保存与迁移</h2><div class="toolbar"><button class="primary" data-action="export">导出 JSON 备份</button><button data-action="import">导入备份</button><button data-action="portable">导出带进度的 HTML</button></div><p class="small-text muted">导入会替换当前记录，并先备份。要分享初始模板，直接发送原 HTML 文件。</p><button class="small" data-action="profile">编辑个人档案</button></section><section class="panel"><h2>参考资料</h2>${SEED.documents.map(d=>`<div class="resource"><h3>${esc(d.title)}（本地资料，未上传）</h3><p>${esc(d.note)}</p></div>`).join('')}<p class="tiny muted">指南供参考，正式要求以项目官网为准。不使用统一中国学分 → ECTS 系数。</p></section><section class="panel"><h2>官方与社区入口</h2>${SEED.resources.map(r=>`<div class="resource"><h3><a href="${esc(safeURL(r.url))}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a></h3><p>${esc(r.note)}</p></div>`).join('')}<details class="brief-help"><summary>辅助工具</summary><p><a href="https://github.com/JulioFang/germany_study_advisor" target="_blank" rel="noopener noreferrer">germany-study-advisor</a> · <a href="https://github.com/anthropics/skills/tree/main/skills/frontend-design" target="_blank" rel="noopener noreferrer">frontend-design</a>。网页根据本地记录重算，不自动联网更新学校规则。</p></details></section>`}
function render(){nav();document.getElementById('app').innerHTML=({overview,schools:schoolPage,courses:coursesPage,common:commonPage,budget:budgetPage,timeline:timelinePage,sources:sourcesPage}[view])();decorateTables();updateLights()}
function updateLights(){document.getElementById('campus-lights').innerHTML=state.schools.map(s=>`<span title="${esc(s.short+'：'+s.status)}" class="${['已递交','审核中','已录取','已注册'].includes(s.status)?'done':''}"></span>`).join('')}
function go(v,s){if(!views.some(x=>x[0]===v))return;view=v;if(s&&state.schools.some(x=>x.id===s))schoolId=s;render();window.scrollTo({top:0,behavior:'auto'})}
function openModal(title,html){const d=document.getElementById('modal');d.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${esc(title)}</h2><button data-action="close" aria-label="关闭">×</button></div>${html}`;d.showModal();const first=d.querySelector('input,select,textarea');if(first)first.focus()}
function closeModal(){document.getElementById('modal').close()}
function taskDialog(scope='common',tid=''){const items=scope==='common'?state.common:state.schools.find(s=>s.id===scope)?.process;if(!items)return;const t=items.find(x=>x.id===tid)||{title:'',group:scope==='common'?'个人待办':'本校步骤',due:'',note:''};openModal(tid?'编辑待办':'添加待办',`<form id="task-form" data-scope="${scope}" data-id="${esc(tid)}"><div class="form-grid"><label class="field full">待办内容<input name="title" required maxlength="250" value="${esc(t.title)}"></label>${field('分类','group',t.group)}${field('个人计划日期','due',t.due,'date')}<label class="field full">备注<textarea name="note">${esc(t.note)}</textarea></label></div><div class="form-actions">${tid?'<button type="button" class="danger" data-action="delete-task" data-id="'+esc(tid)+'" data-scope="'+scope+'">删除这项</button>':''}<button type="button" data-action="close">取消</button><button class="primary" type="submit">保存待办</button></div></form>`)}
function profileDialog(){const p=state.profile;openModal('我的申请档案',`<form id="profile-form"><div class="form-grid">${field('本科院校','school',p.school)}${field('本科专业','major',p.major)}${field('均分 / 100','gpa',p.gpa,'number','min="0" max="100" step="0.1"')}${field('排名前 / %','rank',p.rank,'number','min="0" max="100"')}${field('六级分数','cet',p.cet,'number','min="0" max="710"')}${field('年度预算 / 人民币','budget',p.budget,'number','min="0" max="10000000"')}${field('预计毕业日期','graduate',p.graduate,'date','required')}${field('目标开学日期','intake',p.intake,'date','required')}</div><div class="form-actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">保存档案</button></div></form>`)}
function schoolDialog(sid){const s=state.schools.find(x=>x.id===sid);if(!s)return;openModal(s.short+' · 项目与规则',`<form id="school-form" data-id="${sid}"><div class="form-grid"><label class="field full">目标硕士项目<input name="program" required value="${esc(s.program)}"></label><label class="field full">项目官网<input type="url" name="url" required value="${esc(s.url)}"></label>${field('授课语言','language',s.language)}${field('申请路径','route',s.route)}${selectField('申请状态','status',s.status,['计划申请','准备材料','已递交','补件中','审核中','已录取','已拒绝','已注册'])}${field('2028 截止日期 / 或个人计划','deadline',s.deadline,'date')}<label class="small-text"><input name="deadlineVerified" type="checkbox" ${s.deadlineVerified?'checked':''}> 日期已由当期官网确认</label><label class="small-text"><input name="ruleVerified" type="checkbox" ${s.ruleVerified?'checked':''}> 我已完整核对本项目当期资格</label>${field('英语要求','ielts',s.ielts)}${field('GRE 要求','gre',s.gre)}${field('在读与毕业证规则','graduateRule',s.graduateRule)}${field('每学期学费情景 / 欧元','tuition',s.tuition,'number','min="0" max="100000"')}<label class="field full">规则说明与核查记录<textarea name="ruleNote">${esc(s.ruleNote)}</textarea></label></div><div class="notice" style="margin-top:16px">更换项目后暂停课程覆盖率计算。保存后点击“修改主题与数量条件”，重建新项目要求及课程对应关系；本校流程也应按新项目逐项修改。</div><div class="form-actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">保存项目档案</button></div></form>`)}
function mappingDialog(sid){const s=state.schools.find(x=>x.id===sid);if(!s)return;openModal(s.short+' · 课程对应关系',`<form id="mapping-form" data-id="${sid}"><div class="notice">根据当期项目官网和详细课程大纲维护。每个主题至少一门候选课程即计覆盖，不能替代课程深度及正式学分核查。更换项目后也请修改本校申请流程。</div><label class="field">依据与核查说明<textarea name="matchBasis" required>${esc(s.matchBasis)}</textarea></label><label class="field" style="margin-top:16px">主题与候选课程：每行“主题名称 | 课程代码，以空格分隔”；缺口可留空<textarea name="topics" rows="9" required>${esc(s.topics.map(t=>t.name+' | '+t.ids.join(' ')).join('\n'))}</textarea></label><label class="field" style="margin-top:16px">正式数量条件：每行“唯一编号 | 模块名称 | 最低数量 | 单位”；没有已核实条件可留空<textarea name="formal" rows="5">${esc(s.formal.map(f=>[f.id,f.name,f.min,f.unit].join(' | ')).join('\n'))}</textarea></label><p class="tiny muted">有效代码可在“课程匹配”查找，例如 MAT0021、EIC0241。更新对应关系会清空本校已填的认定学分，避免沿用旧值。官方规则来源在“编辑项目与规则”维护。</p><div class="form-actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">保存并重新计算</button></div></form>`)}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(prefix='TU9进度备份'){download(prefix+'-'+day()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('已导出进度备份')}
function exportPortable(){const copy=document.documentElement.cloneNode(true),s=clone(state);s.snapshotAt=new Date().toISOString();copy.querySelector('#seed').textContent=JSON.stringify(s).replace(/</g,'\\u003c');copy.querySelector('#modal').innerHTML='';copy.querySelector('#modal').removeAttribute('open');copy.querySelector('#toast').className='toast';copy.querySelector('#toast').textContent='';download('德国留学总览-'+day()+'.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('已导出带当前进度的 HTML')}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.view){go(b.dataset.view,b.dataset.school);return}if(b.dataset.schoolSelect){schoolId=b.dataset.schoolSelect;render();return}if(b.dataset.courseFilter){courseFilter=b.dataset.courseFilter;render();return}if(b.dataset.taskFilter){taskFilter=b.dataset.taskFilter;render();return}const a=b.dataset.action;if(a==='add-task')taskDialog(b.dataset.scope||'common');if(a==='edit-task')taskDialog(b.dataset.scope,b.dataset.id);if(a==='close')closeModal();if(a==='profile')profileDialog();if(a==='edit-school')schoolDialog(b.dataset.id);if(a==='edit-mapping')mappingDialog(b.dataset.id);if(a==='export')exportBackup();if(a==='portable')exportPortable();if(a==='import')document.getElementById('import-file').click();if(a==='delete-task'){if(!confirm('删除这项待办？建议先导出备份。'))return;const list=b.dataset.scope==='common'?state.common:state.schools.find(s=>s.id===b.dataset.scope).process;const index=list.findIndex(t=>t.id===b.dataset.id);if(index>=0){const title=list[index].title;list.splice(index,1);save('删除待办：'+title);closeModal();render()}}});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;if(d.task){const list=d.scope==='common'?state.common:state.schools.find(s=>s.id===d.scope).process,item=list.find(x=>x.id===d.task);if(item){item.done=t.checked;save((item.done?'完成：':'重新打开：')+item.title);render()}}if(d.taskNote){const list=d.scope==='common'?state.common:state.schools.find(s=>s.id===d.scope).process,item=list.find(x=>x.id===d.taskNote);if(item){item.note=t.value.slice(0,2000);save()}}if(d.schoolNotes){state.schools.find(s=>s.id===d.schoolNotes).notes=t.value.slice(0,6000);save()}if(d.coursePlan||d.courseStatus||d.courseGrade){const c=state.courses.find(x=>x.id===(d.coursePlan||d.courseStatus||d.courseGrade));if(!c)return;if(d.coursePlan)c.selected=t.checked;if(d.courseStatus)c.status=t.value;if(d.courseGrade)c.grade=t.value===''?'':Math.min(100,Math.max(0,num(t.value)));if(['在修','已完成'].includes(c.status))c.selected=true;save('更新课程：'+c.name);render()}if(d.recognized){state.schools.find(s=>s.id===d.recognized).recognized[d.module]=t.value===''?'':Math.min(500,Math.max(0,num(t.value)));save('更新正式学分核对记录');render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='course-search'){query=ev.target.value;const rows=state.courses.filter(c=>(courseFilter==='all'||courseFilter==='required'&&c.required||courseFilter==='elective'&&!c.required||courseFilter==='done'&&c.status==='已完成')&&(!query||(c.name+' '+c.id+' '+c.category).toLowerCase().includes(query.toLowerCase())));document.getElementById('course-rows').innerHTML=rows.map(courseRow).join('')||'<tr><td colspan="9" class="empty">没有找到课程。</td></tr>'}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!(f instanceof HTMLFormElement))return;ev.preventDefault();if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));
 if(f.id==='task-form'){const scope=f.dataset.scope,list=scope==='common'?state.common:state.schools.find(s=>s.id===scope).process,old=list.find(t=>t.id===f.dataset.id);if(!v.title.trim())return;const t={id:old?.id||id(),title:v.title.trim().slice(0,250),group:v.group.slice(0,80),due:v.due,note:v.note.slice(0,2000),done:old?.done||false,scope};if(old)Object.assign(old,t);else list.push(t);save('保存待办：'+t.title);closeModal();render();toast('待办已保存')}
 if(f.id==='profile-form'){for(const k of ['school','major','graduate','intake'])state.profile[k]=v[k].slice(0,200);for(const k of ['gpa','rank','cet','budget'])state.profile[k]=v[k]===''?'':num(v[k]);save('更新个人申请档案');closeModal();render();toast('申请档案已保存')}
 if(f.id==='exam-form'){for(const k of Object.keys(state.exams))if(k in v)state.exams[k]=v[k].slice(0,6000);save('更新共用考试与 APS 记录');render();toast('九校引用的共用记录已更新')}
 if(f.id==='budget-form'){for(const k of Object.keys(state.budget))if(k in v)state.budget[k]=num(v[k]);state.profile.budget=num(v.annual);save('更新年度预算假设');render();toast('预算与九校情景已重算')}
 if(f.id==='mapping-form'){try{const s=state.schools.find(x=>x.id===f.dataset.id),known=new Set(state.courses.map(c=>c.id));const lines=x=>x.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const topics=lines(v.topics).map(line=>{const parts=line.split('|').map(x=>x.trim());if(parts.length!==2||!parts[0])throw Error('每个主题需要“名称 | 课程代码”的格式。');const ids=[...new Set(parts[1].split(/[\s,，]+/).filter(Boolean))];const bad=ids.filter(x=>!known.has(x));if(bad.length)throw Error('课程代码不存在：'+bad.join('、'));return {name:parts[0].slice(0,160),kind:'自定义待核实',ids}});if(!topics.length||topics.length>30)throw Error('请录入 1 至 30 个主题。');const formal=lines(v.formal).map(line=>{const [id,name,min,unit,...extra]=line.split('|').map(x=>x.trim());if(extra.length||!id||!name||!unit||min===''||!Number.isFinite(Number(min))||Number(min)<0||Number(min)>500)throw Error('数量条件格式应为“唯一编号 | 名称 | 0 至 500 的数量 | 单位”。');return {id:id.slice(0,80),name:name.slice(0,200),min:Number(min),unit:unit.slice(0,60)}});if(formal.length>30||new Set(formal.map(x=>x.id)).size!==formal.length)throw Error('数量条件至多 30 条，编号不能重复。');s.topics=topics;s.formal=formal;s.matchBasis=v.matchBasis.slice(0,6000);s.matchValid=true;s.ruleVerified=false;s.recognized={};save('重建 '+s.short+' 课程对应关系');closeModal();render();toast('已更新对应关系；正式资格仍需核验')}catch(e){toast(e.message)}}
 if(f.id==='school-form'){const s=state.schools.find(x=>x.id===f.dataset.id);if(!safeURL(v.url)){toast('请使用有效的 http 或 https 项目网址');return}const changed=s.program!==v.program;for(const k of ['program','url','language','route','status','deadline','ielts','gre','graduateRule','ruleNote'])s[k]=v[k].slice(0,6000);s.tuition=num(v.tuition);s.deadlineVerified=v.deadlineVerified==='on';s.ruleVerified=v.ruleVerified==='on';if(changed){s.matchValid=false;s.recognized={};s.ruleVerified=false;s.ruleNote='目标项目已更改。原课程主题对照需重新核查。\n'+s.ruleNote;s.matchBasis='注意：项目已更换，以下仍为原项目主题，待重新建立对应关系。'}save('更新 '+s.short+' 项目档案');closeModal();render();toast('本校项目档案已保存')}
});
document.getElementById('import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('备份文件过大，请选择小于 5 MB 的 JSON。');const imported=normalize(JSON.parse(await file.text()));if(!confirm('导入会替换当前进度。页面将先下载当前备份，再载入所选文件。是否继续？'))return;exportBackup('导入前备份');state=imported;save('导入进度备份');render();toast('已导入，并重新计算九校进度')}catch(e){toast('导入失败：'+e.message)}finally{ev.target.value=''}});
document.getElementById('modal').addEventListener('click',ev=>{if(ev.target===ev.currentTarget){const r=ev.currentTarget.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)closeModal()}});
if(storageError){document.getElementById('save-status').textContent='本地读取异常';document.getElementById('save-status').className='save-status bad';document.getElementById('save-banner').innerHTML=`<div class="notice bad">${esc(storageError)}</div>`}else{document.getElementById('save-status').textContent=loadedFrom||'自动保存进度'}
render();let lastDay=day();setInterval(()=>{if(day()!==lastDay){lastDay=day();render()}},60000);
function decorateTables(){document.querySelectorAll('#app .data-table').forEach(table=>{table.classList.add('responsive-table');const labels=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(table.querySelector('#course-rows'))table.classList.add('course-table');table.querySelectorAll('tbody tr').forEach(row=>{[...row.children].forEach((cell,i)=>{if(cell.colSpan===1)cell.dataset.label=labels[i]||''})})})}
document.addEventListener('input',ev=>{if(ev.target.id==='course-search')decorateTables()});
window.TU9={electiveLinks, getState:()=>clone(state),courseMatch:sc=>courseMatch(sc),budgetCalc,insights,normalize,daysTo};
</script>
